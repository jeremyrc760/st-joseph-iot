name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yaml"
      - ".github/workflows/backend-ci.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: st-joseph-iot-backend
  ECS_CLUSTER: st-joseph-iot-cluster
  ECS_SERVICE: st-joseph-iot-backend-service-vge00ihr
  ECS_TASK_DEFINITION: st-joseph-iot-backend
  ECS_CONTAINER_NAME: st-joseph-iot-backend
  API_BASE_URL: https://api.jeremycloudlabs.com

jobs:
  checks:
    name: Check and package backend
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/backend-ci.yaml
    with:
      upload-image: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    name: Deploy validated backend Docker Image to Amazon ECR and ECS
    needs: checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code to the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend Docker image
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.checks.outputs.image-artifact-id }}
          path: ${{ runner.temp }}/backend-image

      - name: Load backend Docker image
        run: |
          docker load \
            --input "${RUNNER_TEMP}/backend-image/backend-image.tar"

      # Step 2: Use GitHub OIDC to assume the AWS IAM role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::697196251337:role/GitHubActions-StJoseph-IoT-CD
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Tag the Docker image using the Git commit SHA
      - name: Tag backend Docker image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            "st-joseph-iot-backend:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # Step 5: Push the image to Amazon ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 6: Download the currently active ECS task definition
      - name: Download current ECS task definition
        shell: bash
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition \
            > task-definition.json

      # Step 7: Replace the container image in the ECS task definition
      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Step 8: Register the new task definition and deploy it to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test deployed backend
        timeout-minutes: 6
        shell: bash
        run: |
          for attempt in {1..12}; do
            echo "Backend smoke test attempt ${attempt}/12"

            if status_code=$(curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${API_BASE_URL}/health") && [[ "$status_code" == "200" ]]; then
              echo "Backend health endpoint returned HTTP 200."
              exit 0
            fi

            echo "Backend check failed (HTTP ${status_code:-unknown})."

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "Backend smoke test failed after 12 attempts."
          exit 1