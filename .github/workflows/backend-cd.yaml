name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: st-joseph-iot-backend
  ECS_CLUSTER: st-joseph-iot-cluster
  ECS_SERVICE: st-joseph-iot-backend-service-vge00ihr
  ECS_TASK_DEFINITION: st-joseph-iot-backend
  ECS_CONTAINER_NAME: st-joseph-backend

jobs:
  build-and-push:
    name: Build, Push and Deploy Backend Docker Image to Amazon ECR and ECS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code to the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Use GitHub OIDC to assume the AWS IAM role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::697196251337:role/GitHubActions-StJoseph-IoT-CD
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build and tag the Docker image using the Git commit SHA
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend

      # Step 5: Push the image to Amazon ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 6: Download the currently active ECS task definition
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            > task-definition.json

      # Step 7: Replace the container image in the ECS task definition
      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Step 8: Register the new task definition and deploy it to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true