name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-cd
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: st-joseph-iot-frontend-697196251337
  CLOUDFRONT_DISTRIBUTION_ID: EO57T4OULUFCW
  VITE_API_BASE_URL: https://api.jeremycloudlabs.com
  VITE_SOCKET_URL: https://api.jeremycloudlabs.com

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code to the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install the Node.js runtime used by the React frontend.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies exactly from package-lock.json.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Check frontend code quality before deployment.
      - name: Run lint checks
        working-directory: frontend
        run: npm run lint

      # Step 5: Build the static frontend with production backend endpoints.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Step 6: Use GitHub OIDC to assume the AWS deployment role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::697196251337:role/GitHubActions-StJoseph-IoT-CD
          aws-region: ${{ env.AWS_REGION }}

      # Step 7: Upload the latest frontend build to the private S3 bucket.
      - name: Sync frontend build to S3
        run: |
          aws s3 sync frontend/dist/ s3://$S3_BUCKET --delete

      # Step 8: Refresh CloudFront so users receive the latest index and assets.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
