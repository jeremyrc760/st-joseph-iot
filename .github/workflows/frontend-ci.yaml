name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yaml"

jobs:
  frontend-ci:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code to the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install the Node.js runtime used by the React frontend.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies exactly from package-lock.json.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Step 4: Check frontend code quality without modifying source files.
      - name: Run lint checks
        working-directory: frontend
        run: npm run lint

      # Step 5: Build the static production frontend bundle.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.jeremycloudlabs.com
          VITE_SOCKET_URL: https://api.jeremycloudlabs.com
        run: npm run build

      # Step 6: Save the built frontend output as a short-lived CI artifact.
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
