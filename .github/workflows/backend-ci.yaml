name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

  workflow_call:
    inputs:
      upload-image:
        description: 'Save the Docker image for deployment'
        required: false
        type: boolean
        default: false
    outputs:
      image-artifact-id:
        description: 'Validated image artifact from the successful CI job'
        value: ${{ jobs.backend-ci.outputs.image-artifact-id }}
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-artifact-id: ${{ steps.upload-image.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube requires the full history to compute accurate code coverage and other metrics.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run lint tests
        working-directory: backend
        run: npm run lint:check

      - name: Run unit tests with code coverage
        working-directory: backend
        run: npm run test:cov -- --runInBand

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build backend Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "st-joseph-iot-backend:${IMAGE_TAG}" \
            ./backend

      - name: Generate full Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: 'image'
          image-ref: 'st-joseph-iot-backend:${{ github.sha }}'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'false'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'

      - name: Upload Trivy vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}-${{ github.run_attempt }}
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: 'image'
          image-ref: 'st-joseph-iot-backend:${{ github.sha }}'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: 'true'
          format: 'table'
          exit-code: '1'

      - name: Save backend Docker image
        if: ${{ inputs.upload-image == true }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker save \
            --output "${RUNNER_TEMP}/backend-image.tar" \
            "st-joseph-iot-backend:${IMAGE_TAG}"

      - name: Upload backend Docker image
        id: upload-image
        if: ${{ inputs.upload-image == true }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1
