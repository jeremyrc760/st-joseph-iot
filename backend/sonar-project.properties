# SonarQube project identity
sonar.projectKey=st-joseph-iot-backend
sonar.projectName=st-joseph-iot-backend

# Source code
sonar.sources=src

# Test files
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts

# Do not analyze test files as production source code
sonar.exclusions=src/**/*.spec.ts

# Jest coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8